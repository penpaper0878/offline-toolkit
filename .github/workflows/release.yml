name: Windows build

# Builds the Windows installer and portable ZIP on a real Windows machine,
# smoke-tests the packaged .exe, and publishes a GitHub (pre-)release with
# both files. It runs when you push a version tag (v0.1.0), when a pushed
# commit message contains [release] (the release is then tagged
# v<package.json version>), or manually from the Actions tab.
on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Bundle Python 3.11 (embeddable) with the worker's packages
        run: node scripts/bundle-python-win.mjs
      - name: Restore the conversion engines
        id: engines-cache
        uses: actions/cache/restore@v4
        with:
          path: engines/win-x64
          key: engines-win-x64-${{ hashFiles('scripts/fetch_engines.py', 'scripts/engines.lock.json') }}
      - name: Conversion engines (LibreOffice, Pandoc, Ghostscript, Tesseract + tessdata_fast, Java + veraPDF, resvg; pinned in scripts/engines.lock.json)
        timeout-minutes: 60   # downloads and unpacking take about 15 minutes; never hang the job
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_engines.py --platform win-x64
      - name: Save the conversion engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engines/win-x64
          key: engines-win-x64-${{ hashFiles('scripts/fetch_engines.py', 'scripts/engines.lock.json') }}
      - name: Engine versions
        shell: pwsh
        run: Get-Content engines/win-x64/manifest.json
      - name: Restore design fonts and models
        id: design-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            fonts
            models
          key: design-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_fonts.py', 'scripts/fonts.lock.json', 'scripts/fetch_models.py') }}
      - name: Design fonts and models (Modules 3 and 4)
        if: steps.design-cache.outputs.cache-hit != 'true'
        shell: bash   # stops at the first failing command (pwsh only reports the last one)
        run: |
          python -m pip install fonttools==4.66.1 numpy==2.4.6 onnx==1.23.1
          python scripts/fetch_fonts.py
          python scripts/fetch_models.py
      - name: Save design fonts and models
        if: steps.design-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fonts
            models
          key: design-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_fonts.py', 'scripts/fonts.lock.json', 'scripts/fetch_models.py') }}
      - name: Design asset sizes
        shell: pwsh
        run: |
          "fonts: {0:N1} MB" -f ((Get-ChildItem fonts -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Get-Content models/manifest.json
      - run: npm run build
      - name: Third-party licences (every bundled component, its licence and copyleft level)
        run: python scripts/collect_licenses.py --platform win-x64 --site-packages build/python-win/Lib/site-packages --python-root build/python-win
      - name: Build the installer (NSIS, per-user, no admin rights)
        run: npx electron-builder --win nsis --publish never
      # The smoke test runs with the network blocked by the operating system: a Windows Firewall rule blocks
      # outbound connections for every program in the app (Electron, Python, LibreOffice, Ghostscript, Tesseract,
      # Java, Pandoc, resvg), and Windows Filtering Platform auditing logs every connection it blocks (event 5157).
      # The test fails if the app needed the network or if any blocked attempt to leave the computer was logged.
      # (Loopback is not filtered: Playwright drives the app over it.)
      - name: Smoke-test the packaged app (network blocked by Windows Firewall)
        shell: pwsh
        run: |
          $app = Join-Path $pwd 'dist\win-unpacked'
          auditpol /set /subcategory:"Filtering Platform Connection" /failure:enable | Out-Null
          $exes = Get-ChildItem $app -Recurse -Filter *.exe
          foreach ($e in $exes) {
            New-NetFirewallRule -DisplayName "otk-offline-$($e.BaseName)-$([guid]::NewGuid().ToString('N').Substring(0, 8))" -Direction Outbound -Program $e.FullName -Action Block | Out-Null
          }
          "Outbound blocked for $($exes.Count) programs: $(($exes | ForEach-Object Name | Sort-Object -Unique) -join ', ')"
          $start = Get-Date
          $env:OTK_PACKAGED_EXE = Join-Path $app 'Offline Toolkit.exe'
          $env:OTK_TEST_PYTHON = Join-Path $app 'resources\engines\python\python.exe'
          npx playwright test tests/e2e/packaged.spec.ts --reporter=list,github
          $code = $LASTEXITCODE
          $leaks = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 5157; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'win-unpacked' -and $_.Message -notmatch 'Destination Address:\s+(127\.|::1|0:0:0:0:0:0:0:1)' })
          "Blocked connection attempts from the app to other computers: $($leaks.Count)"
          "::notice title=Offline smoke test (Windows Firewall)::outbound blocked for $($exes.Count) programs in the app; test exit $code; blocked attempts to reach other computers: $($leaks.Count)"
          $leaks | Select-Object -First 20 | ForEach-Object { $_.Message -replace '\s+', ' ' }
          if ($code -ne 0) { exit $code }
          if ($leaks.Count -gt 0) { Write-Error 'The app tried to reach the network'; exit 1 }
      - name: Make the portable ZIP
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Set-Content -Path 'dist\win-unpacked\portable.txt' -Value 'Portable mode: settings, presets and logs are kept in the "data" folder next to this file. Delete this file to use %APPDATA% instead.'
          Compress-Archive -Path 'dist\win-unpacked\*' -DestinationPath "dist\Offline-Toolkit-$ver-portable-win-x64.zip"
          Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: offline-toolkit-windows
          path: |
            dist/*.exe
            dist/*-portable-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(steps.ver.outputs.version, '0.') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Offline Toolkit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          files: |
            dist/Offline-Toolkit-Setup-*.exe
            dist/*-portable-win-x64.zip
            build/licenses/THIRD-PARTY-NOTICES.txt
          body: |
            Windows 10/11, 64-bit. Personal use.

            **Offline Toolkit 1.0**: one app with a shared home screen and four modules, all running on this computer.

            - **Image Resizer & Compressor**: exact pixels or physical size at any DPI, crop/pad/stretch, a target file size such as 20–50 KB, the DPI written into the file, presets, batches and ZIP.
            - **Document Converter**: PDF, PDF/A (validated by veraPDF), Word, Excel, PowerPoint, HTML, text, EPUB and images in every direction, OCR in 16 languages, and a verification report for every file.
            - **Image to Editable Design**: a poster, screenshot or scan becomes editable text, shapes, graphics, photos and tables; export to PowerPoint, Word, SVG, HTML.
            - **Passport Photo Maker**: face-guided sizing for UK, Schengen, India, Australia, US, China visa and Canada rules (or your own), background replacement, adjustments, exact-size photos and print sheets.
            - **Home screen**: open any file and it goes to the right module, *Try a sample*, recent work across the modules, and Settings → *Check every module* (a full offline self-test).

            Everything is bundled (Python, LibreOffice, Pandoc, Ghostscript, Tesseract, a Java runtime for veraPDF, resvg, 73 font families, AI models), with every download pinned by SHA-256. Settings → *About & licences* and `THIRD-PARTY-NOTICES.txt` list every component and its licence. This build was smoke-tested on Windows with the network blocked by Windows Firewall.

            - `Offline-Toolkit-Setup-*.exe`: installer. Installs for your user only, no admin rights needed.
            - `*-portable-win-x64.zip`: portable. Unzip anywhere and run `Offline Toolkit.exe`. Settings stay in the `data` folder next to it.
            - `THIRD-PARTY-NOTICES.txt`: every bundled component, its licence and the licence texts.

            The app is not code-signed. On first start Windows SmartScreen may say "Windows protected your PC": choose **More info → Run anyway**.
            Everything works offline; the app makes no network connections (Settings → Run offline self-test). Personal use: see the README's *Licences* section before giving the app to anyone.
