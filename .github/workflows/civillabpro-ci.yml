name: CivilLabPro OS

on:
  push:
    paths: ["civillabpro/**", ".github/workflows/civillabpro-ci.yml"]
  pull_request:
    paths: ["civillabpro/**", ".github/workflows/civillabpro-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, hand checks, tests on SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civillabpro/backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: civillabpro/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - name: Independent hand checks of the engineering engines
        run: for f in tests/handcheck/check_*.py; do python "$f"; done
      - name: Tests (SQLite)
        run: pytest
      - name: Migrations and API tests (PostgreSQL)
        env:
          CLP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/clp_test
          CLP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/clp_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          pytest tests/api

  frontend:
    name: Frontend (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civillabpro/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civillabpro/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
