name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      # Electron 44 fetches its binary on first use, not at install time; the worker's tests print with it.
      - name: Fetch the Electron binary
        run: node -e "console.log(require('electron'))"
      # The standalone print (tests only; the app prints in its own window) keeps Chromium's sandbox, which on
      # runners without unprivileged user namespaces needs the setuid helper.
      - name: Electron sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run setup:py

      # Module 3: the bundled fonts (google/fonts at a pinned commit, checked against scripts/fonts.lock.json)
      # and models (Real-ESRGAN converted to ONNX, MediaPipe selfie segmenter), cached per OS.
      - name: Restore design fonts and models
        id: design-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            fonts
            models
          key: design-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_fonts.py', 'scripts/fonts.lock.json', 'scripts/fetch_models.py') }}
      - name: Design fonts and models
        if: steps.design-cache.outputs.cache-hit != 'true'
        shell: bash   # stops at the first failing command (pwsh only reports the last one)
        run: |
          node scripts/run-python.mjs --online scripts/fetch_fonts.py
          node scripts/run-python.mjs --online scripts/fetch_models.py
      - name: Save design fonts and models
        if: steps.design-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fonts
            models
          key: design-assets-${{ runner.os }}-${{ hashFiles('scripts/fetch_fonts.py', 'scripts/fonts.lock.json', 'scripts/fetch_models.py') }}

      # Conversion engines (Module 2). Linux: distribution packages + pinned downloads.
      # Windows: the same script the release uses (Chocolatey + pinned downloads), cached.
      - name: Engines (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-calc \
            libreoffice-impress libreoffice-draw ghostscript tesseract-ocr tesseract-ocr-hin tesseract-ocr-ara \
            tesseract-ocr-heb tesseract-ocr-tam default-jre-headless fonts-noto-core fonts-crosextra-carlito \
            fonts-crosextra-caladea fonts-liberation2 fonts-dejavu-core xvfb
          python scripts/fetch_engines.py --platform linux-x64
      - name: Restore engines (Windows)
        if: runner.os == 'Windows'
        id: engines-cache
        uses: actions/cache/restore@v4
        with:
          path: engines/win-x64
          key: engines-win-x64-${{ hashFiles('scripts/fetch_engines.py') }}
      - name: Engines (Windows)
        if: runner.os == 'Windows' && steps.engines-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_engines.py --platform win-x64
      # Saved right away, so a failing test later in the job doesn't throw the download away.
      - name: Save engines (Windows)
        if: runner.os == 'Windows' && steps.engines-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engines/win-x64
          key: engines-win-x64-${{ hashFiles('scripts/fetch_engines.py') }}

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:py
      - run: npm run build
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx playwright test
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: Offline run (Linux network namespace, no network interfaces)
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PATH bash -c 'sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true; ./scripts/test-offline.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # Every route on the sample corpus (about 270 conversions), on demand or with [matrix] in the commit message.
  matrix:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[matrix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      # Electron 44 fetches its binary on first use, not at install time; the worker's tests print with it.
      - name: Fetch the Electron binary
        run: node -e "console.log(require('electron'))"
      # The standalone print (tests only; the app prints in its own window) keeps Chromium's sandbox, which on
      # runners without unprivileged user namespaces needs the setuid helper.
      - name: Electron sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run setup:py
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-calc \
            libreoffice-impress libreoffice-draw ghostscript tesseract-ocr tesseract-ocr-hin tesseract-ocr-ara \
            tesseract-ocr-heb tesseract-ocr-tam default-jre-headless fonts-noto-core fonts-crosextra-carlito \
            fonts-crosextra-caladea fonts-liberation2 fonts-dejavu-core
          python scripts/fetch_engines.py --platform linux-x64
      - run: OTK_FULL_MATRIX=1 node scripts/run-python.mjs -m pytest -q worker/tests/test_converter_matrix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: converter-matrix
          path: test-results/
